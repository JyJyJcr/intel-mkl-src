[package]
name = "intel-mkl-src"
version = "0.8.1"
authors = ["Toshiki Teramura <toshiki.teramura@gmail.com>"]
edition = "2018"

rust-version = "1.61.0"

description = "Redistribution of Intel(R) MKL as a crate"
repository = "https://github.com/rust-math/intel-mkl-src"
keywords = ["fft", "blas", "lapack"]
license-file = "../License.txt"
readme = "../README.md"

build = "build.rs"
links = "mkl_core"

[features]
default = []

# MKL config
# https://software.intel.com/content/www/us/en/develop/articles/intel-math-kernel-library-intel-mkl-and-pkg-config-tool.html
mkl-static-lp64-iomp   = [ "static",  "lp64",  "iomp" ]
mkl-static-lp64-seq    = [ "static",  "lp64",  "seq"  ]
mkl-static-ilp64-iomp  = [ "static",  "ilp64", "iomp" ]
mkl-static-ilp64-seq   = [ "static",  "ilp64", "seq"  ]
mkl-dynamic-lp64-iomp  = [ "dynamic", "lp64",  "iomp" ]
mkl-dynamic-lp64-seq   = [ "dynamic", "lp64",  "seq"  ]
mkl-dynamic-ilp64-iomp = [ "dynamic", "ilp64", "iomp" ]
mkl-dynamic-ilp64-seq  = [ "dynamic", "ilp64", "seq"  ]

static = []
dynamic = []

lp64 = []
ilp64 = []

seq = []
iomp = []

[build-dependencies]
anyhow = "1.0.58"
pkg-config = "0.3.32"
# ocipkg = "0.2.8"
